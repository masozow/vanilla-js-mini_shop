<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="/css/styles.css"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript><link rel="stylesheet" href="/css/styles.css" /> </noscript>
    <script type="module" src="/src/main.js"></script>
    <title>Shopping cart</title>
  </head>
  <body>
    <main>
      <section id="product" class="product-section">
        <div id="search-box" class="controls">
          <label for="product-search" id="products-search-label"
            >Search products</label
          >
          <input
            id="product-search"
            type="search"
            placeholder="Search products..."
          />
        </div>
        <div
          id="product-results"
          class="product-results"
          aria-live="polite"
        ></div>
      </section>
      <section id="cart" class="cart-section">
        <h1>Cart</h1>
        <div id="cart-results" class="cart-results"></div>
        <div id="summary" class="cart-totals">
          <p>Subtotal</p>
          <p id="subtotal">0.00</p>
          <p>Discount</p>
          <p id="discount">0.00</p>
          <p>Total</p>
          <p id="total">0.00</p>
        </div>
      </section>
    </main>
  </body>
</html>
